<!DOCTYPE html>
<html lang="en">
<head>
    <!--
      * Project: EGGStation - Unified Multi-System Console Virtual Environment
      * Author: Enrique González Gutiérrez
      * File: index.html
      * 
      * Role:
      * Master View / DOM Layout. Provides the structured UI elements (Canvas, Buttons, 
      * Overlays) required by the UIControllers.
      * 
      * Architectural & SOLID Principles Alignment:
      * 1. Single Responsibility Principle (SRP): This file is strictly responsible 
      *    for the DOM structure and resource linking. It contains absolutely zero 
      *    inline JavaScript or business logic.
      * 2. Open/Closed Principle (OCP): New emulators (e.g., GBA, NES) can be added 
      *    simply by appending their <script> blocks at the bottom, without needing 
      *    to alter the existing DOM nodes or layout structure.
      * 3. Dependency Inversion Principle (DIP): The UI elements use generic IDs 
      *    (like #crt-wrapper, #virtual-gamepad) that the generic UIControllers bind 
      *    to, rather than the HTML knowing about the underlying hardware.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EGGStation | Unified Multi-System Console Virtual Environment</title>
    
    <!-- Synthwave / Glassmorphism UI Stylesheet -->
    <link rel="stylesheet" href="css/main.css">
    
    <!-- External Compression Libraries (For decompression of zipped ROM packages) -->
    <script src="js/snes/lib/zip.js"></script>
    <script src="js/snes/lib/inflate.js"></script>
    <script src="js/snes/lib/deflate.js"></script>
</head>
<body>

    <!-- Main Grid App Container -->
    <div id="app-container">

        <!-- HEADER: Branding & System Swapper -->
        <header id="top-bar">
            <div class="brand">
                <img src="img/eggstation-visualizer.png" alt="EGGStation Logo" class="brand-logo">
                <h1>EGG<span>Station</span></h1>
            </div>
            
            <div class="system-stats">
                <!-- Swapping console types triggers hardware-level hot-rebooting -->
                <select id="consoleSelector" class="sys-selector">
                    <option value="SMS">Sega Master System</option>
                    <option value="GEN">Sega Genesis / Mega Drive</option>
                    <option value="SNES">Super Nintendo (SNES)</option>
                </select>
                <span id="fpsSpan">0.0 FPS</span>
                <button id="dev-toggle-btn" class="btn outline-btn">DEV MODE</button>
            </div>
        </header>

        <!-- STAGE: Aspect-Ratio Television Viewport & ROM Overlay -->
        <main id="stage">
            <div id="crt-wrapper">
                <!-- Hardware 2D Canvas (Primary frame output) -->
                <canvas id="smsdisplay"></canvas>
                
                <!-- WebGL2 Canvas (Target for unified CRT-Royale Shader across all consoles) -->
                <canvas id="webgldisplay" class="hidden"></canvas>
                
                <!-- Overlay ROM Uploader -->
                <div id="fileselector" class="overlay-center">
                    <button id="romLoaderBtn" class="btn primary-btn pulse-anim">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        INSERT CARTRIDGE
                    </button>
                    <input type="file" id="cartridgeSelector" accept=".sms,.sg,.md,.gen,.bin,.smd,.sfc,.smc,.zip" style="display: none;">
                </div>
            </div>

            <!-- Virtual On-Screen Gamepad for Mobile Viewports -->
            <section id="virtual-gamepad">
                <div class="d-pad">
                    <button class="v-dir" id="v-up"></button>
                    <button class="v-dir" id="v-left"></button>
                    <button class="v-dir" id="v-right"></button>
                    <button class="v-dir" id="v-down"></button>
                    <div class="v-center"></div>
                </div>
                <div class="center-controls">
                    <button class="v-system-btn" id="v-select">SELECT</button>
                    <button class="v-system-btn" id="v-pause">START</button>
                </div>
                <div class="action-buttons">
                    <button class="v-action" id="v-btnY">Y</button>
                    <button class="v-action" id="v-btnX">X</button>
                    <button class="v-action" id="v-btn2">B</button>
                    <button class="v-action" id="v-btn1">A</button>
                </div>
            </section>
        </main>

        <!-- SIDEBAR: Settings & Hardware Toggles (Monomorphic UI) -->
        <aside id="settings-panel" class="glass-panel">
            <div class="panel-section">
                <h3>System Configuration</h3>

                <div class="control-group">
                    <label>Audio Output</label>
                    <select id="audioToggleSelector">
                        <option value="enabled">Audio Enabled</option>
                        <option value="disabled">Mute / Disable Audio</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Audio DSP Filter</label>
                    <select id="audioFilterSelector">
                        <option value="0">Studio Clean (Bypass)</option>
                        <option value="1">Low-Pass RF Filter (3.5KHz)</option>
                        <option value="2">Analog Stereo Width</option>
                    </select>
                </div>
                
                <button id="ejectBtn" class="btn eject-btn-retro mt-3">
                    <svg class="icon-eject" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 17h14v2H5zM12 5l-7 8h14z"/>
                    </svg>
                    EJECT CARTRIDGE
                </button>
            </div>

            <!-- Unified Post-Processing Sliders & Filters -->
            <div class="panel-section">
                <h3>Video Output</h3>
                <div class="control-group">
                    <label>Post-Processing Engine</label>
                    <select id="postProcessSelector">
                        <option value="0">1x Sharp (Nearest Neighbor)</option>
                        <option value="1">1x Bilinear (Smooth)</option>
                        <option value="2">Scale2X (Hardware Upscaler)</option>
                        <option value="3">Scale2X + Fixed Scanlines</option>
                        <option value="4">Scale4X (Cartoon Smoothing)</option>
                        <option value="5">NTSC Analog Bleed</option>
                        <option value="6">WebGL2: CRT-Royale Shader</option>
                    </select>
                </div>
                
                <!-- Dynamic Shader Tuner -->
                <div class="control-group shader-tuner">
                    <label>CRT Curvature</label>
                    <input type="range" id="sh-curvature" min="0" max="200" value="90">
                    <label>Scanline Weight</label>
                    <input type="range" id="sh-scanlines" min="0" max="100" value="38">
                </div>
            </div>

            <!-- Persistence Panel linked to IndexedDB storage engine -->
            <div class="panel-section">
                <h3>Temporal Physics</h3>
                <div class="savestate-preview">
                    <img id="savestateImg" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Savestate Empty">
                </div>
                <div class="savestate-actions">
                    <button id="btn-save" class="btn outline-btn">SAVE (F2)</button>
                    <button id="btn-load" class="btn outline-btn">LOAD (F3)</button>
                </div>
            </div>
        </aside>

        <!-- DEVELOPER SUITE: Hardware Diagnostics (Grows dynamically on desktop) -->
        <footer id="developer-suite" class="glass-panel hidden">
            <div class="dev-section">
                <h4>Execution Core</h4>
                <div class="dev-btn-group">
                    <button id="dbg-play" class="btn dev-btn">▶ PLAY</button>
                    <button id="dbg-pause" class="btn dev-btn">⏸ PAUSE</button>
                </div>
            </div>
            
            <div class="dev-section">
                <h4>Hardware Registers</h4>
                <!-- Cleared and structured dynamically with Z80, M68K, or 65816 labels by UIControllers -->
                <div class="registers-grid" id="reg-grid"></div>
            </div>

            <div class="dev-section">
                <h4>Diagnostic VRAM Viewer</h4>
                <div class="vram-preview-wrapper">
                    <!-- Standard diagnostic canvas populated with active pattern tables -->
                    <canvas id="vram-canvas" width="128" height="192"></canvas>
                </div>
            </div>

            <div class="dev-section">
                <h4>System Logs</h4>
                <div id="log" class="terminal-box"></div>
            </div>
        </footer>

    </div>

    <!-- ========================================================= -->
    <!-- UNIVERSAL SHARED INFRASTRUCTURE & UTILITIES (PHASE 2)     -->
    <!-- ========================================================= -->
    <script src="js/shared/video/UniversalPostProcessor.js"></script>
    <script src="js/shared/storage/IndexedDbManager.js"></script>

    <!-- ========================================================= -->

    <!-- ========================================================= -->

    <script src="js/shared/cpu/z80/Z80Alu.js"></script>
    <script src="js/shared/cpu/z80/ZilogZ80.js"></script>

    <script src="js/shared/cpu/z80/instructions/Z80Arithmetic.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80Bitwise.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80ShiftRotate.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80ProgramFlow.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80BlockOps.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80SystemIO.js"></script>

    <!-- ========================================================= -->

    <!-- ========================================================= -->
    <script src="js/sms/domain/bus/SegaMasterSystemBus.js"></script>
    <script src="js/sms/domain/cartridge/SegaMasterSystemCartridge.js"></script>
    <script src="js/sms/domain/cartridge/mappers/BaseMapper.js"></script>
    <script src="js/sms/domain/cartridge/mappers/SegaMapper.js"></script>
    <script src="js/sms/domain/cartridge/mappers/CodemastersMapper.js"></script>
    <script src="js/sms/domain/cartridge/mappers/KoreanMapper.js"></script>
    <script src="js/sms/domain/cartridge/mappers/SegaMasterSystemMapperFactory.js"></script>
    <script src="js/sms/domain/controller/Sega315_5297.js"></script>
    <script src="js/sms/infrastructure/video/Sega315_5124_Vdp.js"></script>
    <script src="js/sms/infrastructure/video/VdpSpriteManager.js"></script>
    <script src="js/sms/infrastructure/video/VdpMode2Renderer.js"></script>
    <script src="js/sms/infrastructure/video/VdpMode4Renderer.js"></script>
    <script src="js/sms/infrastructure/audio/Sega315_5124_Psg.js"></script>
    <script src="js/sms/application/SmsOrchestrator.js"></script>
    <script src="js/sms/presentation/SmsUIController.js"></script>

    <!-- ========================================================= -->

    <script src="js/genesis/domain/bus/GenesisBusM68k.js"></script>
    <script src="js/genesis/domain/controller/GenesisIoPort.js"></script>

    <script src="js/genesis/domain/cpu/m68000.js"></script>
    <script src="js/genesis/domain/cpu/instructions/M68kSystemExceptions.js"></script>
    <script src="js/genesis/domain/cpu/instructions/M68kDataTransfer.js"></script>

    <script src="js/genesis/domain/cpu/instructions/M68kShiftRotate.js"></script>

    <!-- ========================================================= -->

    <!-- ========================================================= -->
    <script src="js/snes/infrastructure/SnesCompatibilityLayer.js"></script>
    <script src="js/snes/infrastructure/audio/SnesAudioProcessor.js"></script>
    
    <script src="js/snes/domain/cpu/SnesCpu.js"></script>
    <script src="js/snes/domain/cpu/SnesCpuAddressing.js"></script>

    <script src="js/snes/domain/spc/SnesSpc.js"></script>
    <script src="js/snes/domain/spc/SnesSpcAddressing.js"></script>
    <script src="js/snes/domain/spc/SnesSpcArithmetic.js"></script>
    <script src="js/snes/domain/spc/SnesSpcLogic.js"></script>
    <script src="js/snes/domain/spc/SnesSpcDataOps.js"></script>

    <script src="js/snes/domain/apu/SnesApuTimer.js"></script>
    <script src="js/snes/domain/apu/SnesApu.js"></script>

    <script src="js/snes/domain/dsp/SnesDsp.js"></script>
    <script src="js/snes/domain/dsp/SnesDspTables.js"></script>

    <script src="js/snes/domain/cartridge/SnesCartridge.js"></script>

    <script src="js/snes/domain/ppu/SnesPpu.js"></script>
    <script src="js/snes/domain/ppu/SnesPpuTables.js"></script>
    <script src="js/snes/domain/ppu/SnesPpuBackground.js"></script>
    <script src="js/snes/domain/ppu/SnesPpuSprite.js"></script>
    <script src="js/snes/domain/ppu/SnesPpuMode7.js"></script>
    <script src="js/snes/domain/ppu/SnesPpuCompositor.js"></script>

    <script src="js/snes/domain/bus/SnesMemoryMap.js"></script>

    <script src="js/snes/domain/system/SnesSystem.js"></script>
    <script src="js/snes/domain/system/SnesSystemDma.js"></script>
    <script src="js/snes/domain/system/SnesSystemIoPorts.js"></script>
    <script src="js/snes/domain/system/SnesSystemBus.js"></script>
    
    <script src="js/snes/application/SnesOrchestrator.js"></script>
    <script src="js/snes/presentation/SnesUIController.js"></script>

    <!-- ========================================================= -->
    <!-- SYSTEM BOOTSTRAPPER (Composition Root)                    -->
    <!-- ========================================================= -->
    <script src="js/app.js"></script>
</body>
</html>
