<!doctype html>
<!-- 
 * Project: EGGStation - Sega Master System Emulator
 * Author: Enrique González Gutiérrez
 * 
 * Presentation Layer: HTML Entry Point
 * 
 * Sets up the DOM structure, visual elements, and imports the architectural 
 * layers. Includes Responsive Design, Mobile Gamepad, and Soundstage selectors.
-->
<html lang="en">
    <head>
        <meta charset="utf-8">
        <!-- Prevent zooming on mobile devices to ensure Virtual Gamepad works perfectly -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta name="description" content="EGGStation - Clean Architecture Sega Master System Emulator">
        <meta name="keywords" content="Sega Master System emulator, EGGStation, emulation, SEGA, retro games, clean code, DDD">

        <link rel="icon" type="image/png" href="img/favicon.ico"/>
        <title>EGGStation - Sega Master System Emulator</title>

        <!-- Presentation Layer: CSS Stylesheet -->
        <link rel="stylesheet" href="css/main.css"/>
        
        <!-- ========================================== -->
        <!-- INFRASTRUCTURE LAYER                       -->
        <!-- ========================================== -->
        <script src="js/infrastructure/audio/Sega315_5124_Psg.js"></script>
        <script src="js/infrastructure/video/Sega315_5124_Vdp.js"></script>
        <script src="js/infrastructure/storage/WebLocalStorageSerializer.js"></script>

        <!-- ========================================== -->
        <!-- DOMAIN LAYER                               -->
        <!-- ========================================== -->
        <script src="js/domain/cartridge/SegaMasterSystemCartridge.js"></script>
        <script src="js/domain/cartridge/mappers/BaseMapper.js"></script>
        <script src="js/domain/cartridge/mappers/SegaMapper.js"></script>
        <script src="js/domain/cartridge/mappers/CodemastersMapper.js"></script>
        <script src="js/domain/cartridge/mappers/KoreanMapper.js"></script>
        <script src="js/domain/cartridge/mappers/SegaMasterSystemMapperFactory.js"></script>
        <script src="js/domain/controller/Sega315_5297.js"></script>
        <script src="js/domain/bus/SegaMasterSystemBus.js"></script>
        <script src="js/domain/cpu/Z80Registers.js"></script>
        <script src="js/domain/cpu/Z80Alu.js"></script>
        <script src="js/domain/cpu/instructions/Z80DataTransfer.js"></script>
        <script src="js/domain/cpu/instructions/Z80Arithmetic.js"></script>
        <script src="js/domain/cpu/instructions/Z80Bitwise.js"></script>
        <script src="js/domain/cpu/instructions/Z80ShiftRotate.js"></script>
        <script src="js/domain/cpu/instructions/Z80ProgramFlow.js"></script>
        <script src="js/domain/cpu/instructions/Z80BlockOps.js"></script>
        <script src="js/domain/cpu/instructions/Z80SystemIO.js"></script>
        <script src="js/domain/cpu/ZilogZ80.js"></script>

        <!-- ========================================== -->
        <!-- APPLICATION & PRESENTATION LAYERS          -->
        <!-- ========================================== -->
        <script src="js/application/EmulatorOrchestrator.js"></script>
        <script src="js/presentation/UIController.js"></script>
        <script src="js/app.js"></script>
    </head>

    <body>
        <!-- Header & Info Area -->
        <header id="titleDiv" class="glass-panel">
            <div class="brand">
                <span class="logo-text">EGGStation</span>
                <span class="fps-counter"><span id="fpsSpan">-- FPS</span></span>
            </div>
            
            <div class="header-controls">
                <a class="tooltip icon-btn" href="#" onclick="return false;">
                    📷
                    <span><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" id="savestateImg" alt="Snapshot slot preview" /></span>
                </a>
                <a class="tooltip icon-btn" href="#" onclick="return false;">
                    ℹ️
                    <span class="help-tooltip">
                        <strong>Keyboard Controls:</strong><br>
                        - Z / X : Button 1 / Button 2<br>
                        - Arrow Keys : D-Pad<br>
                        - \ : Fast Forward<br>
                        - P : Pause Emulator<br>
                        - O : Physical SMS PAUSE<br>
                        - F2 / F3 : Save / Load State
                    </span>
                </a>
            </div>
        </header>

        <main>
            <!-- Visualizer CRT Frame -->
            <div id="emulator-container">
                <canvas width="256" height="240" id="smsdisplay"></canvas>
            </div>

            <!-- Virtual Gamepad (Visible ONLY on Mobile/Touch devices) -->
            <div id="virtual-gamepad" class="mobile-only">
                <div class="d-pad">
                    <div class="d-row"><button id="v-up" class="v-btn">▲</button></div>
                    <div class="d-row center">
                        <button id="v-left" class="v-btn">◀</button>
                        <div class="d-center"></div>
                        <button id="v-right" class="v-btn">▶</button>
                    </div>
                    <div class="d-row"><button id="v-down" class="v-btn">▼</button></div>
                </div>
                <div class="action-buttons">
                    <button id="v-pause" class="v-btn small-btn">PAUSE</button>
                    <button id="v-btn1" class="v-btn round-btn">1</button>
                    <button id="v-btn2" class="v-btn round-btn">2</button>
                </div>
            </div>

            <!-- Interactive Control Panel -->
            <div class="control-panel glass-panel" id="settings-panel">
                <div class="control-group" id="fileselector">
                    <label for="romLoaderBtn">Console Slot</label>
                    <button id="romLoaderBtn" class="primary-btn">Load ROM Cartridge</button>
                    <input type="file" id="cartridgeSelector" class="hidden" accept=".sms,.sg">
                </div>

                <div class="control-group">
                    <label for="vdpModeSelector">TV Standard</label>
                    <select id="vdpModeSelector">
                        <option value="NTSC">NTSC (60Hz)</option>
                        <option value="PAL">PAL (50Hz)</option>
                    </select>
                </div>

                <!-- Post-Processing Visual Filters Selection -->
                <div class="control-group">
                    <label for="postProcessSelector">Visual Filter</label>
                    <select id="postProcessSelector">
                        <option value="0">Retro Sharp (Nearest)</option>
                        <option value="1">Analog Soft (Bilinear)</option>
                        <option value="2">Scale2X HD (Smart Smoothing)</option>
                        <option value="3">CRT Scanlines (Sony Trinitron)</option>
                        <option value="4">Scale4X Cartoon HD (Vector Smooth)</option>
                        <option value="5">NTSC Signal Bleed (Composite TV)</option>
                    </select>
                </div>

                <!-- Audio DSP Soundstage Selection -->
                <div class="control-group">
                    <label for="audioFilterSelector">Audio Soundstage</label>
                    <select id="audioFilterSelector">
                        <option value="0">Original Mono (Chippy Dry)</option>
                        <option value="1">Arcade Warmth (Low-Pass Filter)</option>
                        <option value="2">Lush 3D Stereo (Haas Spatial Delay)</option>
                    </select>
                </div>
            </div>
        </main>
    </body>
</html>
