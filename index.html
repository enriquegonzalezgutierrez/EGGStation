<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EGGStation | Ultimate Web Emulator</title>
    
    <!-- Synthwave / Glassmorphism UI Stylesheet -->
    <link rel="stylesheet" href="css/main.css">
    
    <!-- External Compression Libraries (Decompression of .zip ROMs) -->
    <script src="js/snes/lib/zip.js"></script>
    <script src="js/snes/lib/inflate.js"></script>
    <script src="js/snes/lib/deflate.js"></script>
</head>
<body>

    <!-- Main Grid App Container -->
    <div id="app-container">

        <!-- HEADER: Branding & Global Console Selectors -->
        <header id="top-bar">
            <div class="brand">
                <img src="img/eggstation-visualizer.png" alt="EGGStation Logo" class="brand-logo">
                <h1>EGG<span>Station</span></h1>
            </div>
            
            <div class="system-stats">
                <select id="consoleSelector" class="sys-selector">
                    <option value="SMS">Sega Master System</option>
                    <option value="GEN">Sega Genesis / Mega Drive</option>
                    <option value="SNES">Super Nintendo (SNES)</option>
                </select>
                <span id="fpsSpan">0.0 FPS</span>
                <button id="dev-toggle-btn" class="btn outline-btn">DEV MODE</button>
            </div>
        </header>

        <!-- STAGE: CRT Viewport & ROM Overlay -->
        <main id="stage">
            <div id="crt-wrapper">
                <!-- Hardware 2D Canvas (Primary output) -->
                <canvas id="smsdisplay"></canvas>
                <!-- WebGL2 Canvas (CRT-Royale / Advanced Shaders) -->
                <canvas id="webgldisplay" class="hidden"></canvas>
                
                <!-- Overlay ROM Uploader -->
                <div id="fileselector" class="overlay-center">
                    <button id="romLoaderBtn" class="btn primary-btn pulse-anim">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        INSERT CARTRIDGE
                    </button>
                    <input type="file" id="cartridgeSelector" accept=".sms,.sg,.md,.gen,.bin,.smd,.sfc,.smc" style="display: none;">
                </div>
            </div>

            <!-- Virtual On-Screen Gamepad for Mobile Views -->
            <section id="virtual-gamepad">
                <div class="d-pad">
                    <button class="v-dir" id="v-up"></button>
                    <button class="v-dir" id="v-left"></button>
                    <button class="v-dir" id="v-right"></button>
                    <button class="v-dir" id="v-down"></button>
                    <div class="v-center"></div>
                </div>
                <div class="center-controls">
                    <button class="v-system-btn" id="v-select">SELECT</button>
                    <button class="v-system-btn" id="v-pause">START</button>
                </div>
                <div class="action-buttons">
                    <button class="v-action" id="v-btnY">Y</button>
                    <button class="v-action" id="v-btnX">X</button>
                    <button class="v-action" id="v-btn2">B</button>
                    <button class="v-action" id="v-btn1">A</button>
                </div>
            </section>
        </main>

        <!-- SIDEBAR: Settings & Hardware Toggles -->
        <aside id="settings-panel" class="glass-panel">
            <div class="panel-section">
                <h3>System Configuration</h3>
                
                <!-- Sega Specific Config -->
                <div class="control-group" id="sms-config-section">
                    <label>Video Standard</label>
                    <select id="vdpModeSelector">
                        <option value="NTSC">NTSC (60Hz)</option>
                        <option value="PAL">PAL (50Hz)</option>
                    </select>
                </div>

                <!-- SNES Specific Config -->
                <div class="control-group hidden" id="snes-config-section">
                    <label>Cartridge Mode</label>
                    <select id="ishirom-toggle">
                        <option value="false">LoROM (Standard)</option>
                        <option value="true">HiROM (Enhanced)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Audio Output</label>
                    <select id="audioToggleSelector">
                        <option value="enabled">Audio Enabled</option>
                        <option value="disabled">Mute / Disable Audio</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Audio DSP Filter</label>
                    <select id="audioFilterSelector">
                        <option value="0">Studio Clean (Bypass)</option>
                        <option value="1">Low-Pass RF Filter (3.5KHz)</option>
                        <option value="2">Analog Stereo Width</option>
                    </select>
                </div>
                
                <button id="ejectBtn" class="btn eject-btn-retro mt-3">
                    <svg class="icon-eject" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 17h14v2H5zM12 5l-7 8h14z"/>
                    </svg>
                    EJECT CARTRIDGE
                </button>
            </div>

            <!-- Unified Post-Processing Sliders & Filters -->
            <div class="panel-section">
                <h3>Video Output</h3>
                <div class="control-group">
                    <label>Post-Processing Engine</label>
                    <select id="postProcessSelector">
                        <option value="0">1x Sharp (Nearest Neighbor)</option>
                        <option value="1">1x Bilinear (Smooth)</option>
                        <option value="2">Scale2X (Hardware Upscaler)</option>
                        <option value="3">Scale2X + Fixed Scanlines</option>
                        <option value="4">Scale4X (Cartoon Smoothing)</option>
                        <option value="5">NTSC Analog Bleed</option>
                        <option value="6">WebGL2: CRT-Royale Shader</option>
                    </select>
                </div>
                
                <!-- Dynamic Shader Tuner -->
                <div class="control-group shader-tuner">
                    <label>CRT Curvature</label>
                    <input type="range" id="sh-curvature" min="0" max="200" value="90">
                    <label>Scanline Weight</label>
                    <input type="range" id="sh-scanlines" min="0" max="100" value="38">
                </div>
            </div>

            <div class="panel-section">
                <h3>Temporal Physics</h3>
                <div class="savestate-preview">
                    <img id="savestateImg" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Savestate Empty">
                </div>
                <div class="savestate-actions">
                    <button id="btn-save" class="btn outline-btn">SAVE (F2)</button>
                    <button id="btn-load" class="btn outline-btn">LOAD (F3)</button>
                </div>
            </div>
        </aside>

        <!-- DEVELOPER SUITE: Hardware Diagnostics -->
        <footer id="developer-suite" class="glass-panel hidden">
            <div class="dev-section">
                <h4>Execution Core</h4>
                <div class="dev-btn-group">
                    <button id="dbg-play" class="btn dev-btn">▶ PLAY</button>
                    <button id="dbg-pause" class="btn dev-btn">⏸ PAUSE</button>
                </div>
            </div>
            <div class="dev-section">
                <h4>Hardware Registers</h4>
                <div class="registers-grid" id="reg-grid"></div>
            </div>
            <div class="dev-section">
                <h4>System Logs</h4>
                <div id="log" class="terminal-box"></div>
            </div>
        </footer>

    </div>

    <!-- ========================================================= -->
    <!-- SEGA MASTER SYSTEM CORE                                   -->
    <!-- ========================================================= -->
    <script src="js/sms/domain/bus/SegaMasterSystemBus.js"></script>
    <script src="js/sms/domain/cartridge/SegaMasterSystemCartridge.js"></script>
    <script src="js/sms/domain/cartridge/mappers/BaseMapper.js"></script>
    <script src="js/sms/domain/cartridge/mappers/SegaMapper.js"></script>
    <script src="js/sms/domain/cartridge/mappers/CodemastersMapper.js"></script>
    <script src="js/sms/domain/cartridge/mappers/KoreanMapper.js"></script>
    <script src="js/sms/domain/cartridge/mappers/SegaMasterSystemMapperFactory.js"></script>
    <script src="js/sms/domain/controller/Sega315_5297.js"></script>
    <script src="js/sms/domain/cpu/Z80Registers.js"></script>
    <script src="js/sms/domain/cpu/Z80Alu.js"></script>
    <script src="js/sms/domain/cpu/ZilogZ80.js"></script>
    <script src="js/sms/domain/cpu/Z80Disassembler.js"></script>
    <script src="js/sms/domain/cpu/instructions/Z80DataTransfer.js"></script>
    <script src="js/sms/domain/cpu/instructions/Z80Arithmetic.js"></script>
    <script src="js/sms/domain/cpu/instructions/Z80Bitwise.js"></script>
    <script src="js/sms/domain/cpu/instructions/Z80ShiftRotate.js"></script>
    <script src="js/sms/domain/cpu/instructions/Z80ProgramFlow.js"></script>
    <script src="js/sms/domain/cpu/instructions/Z80BlockOps.js"></script>
    <script src="js/sms/domain/cpu/instructions/Z80SystemIO.js"></script>
    <script src="js/sms/infrastructure/video/Sega315_5124_Vdp.js"></script>
    <script src="js/sms/infrastructure/video/VdpPostProcessor.js"></script>
    <script src="js/sms/infrastructure/video/VdpSpriteManager.js"></script>
    <script src="js/sms/infrastructure/video/VdpMode2Renderer.js"></script>
    <script src="js/sms/infrastructure/video/VdpMode4Renderer.js"></script>
    <script src="js/sms/infrastructure/audio/Sega315_5124_Psg.js"></script>
    <script src="js/sms/infrastructure/storage/WebLocalStorageSerializer.js"></script>
    <script src="js/sms/application/EmulatorOrchestrator.js"></script>
    <script src="js/sms/presentation/UIController.js"></script>

    <!-- ========================================================= -->
    <!-- SEGA GENESIS CORE                                         -->
    <!-- ========================================================= -->
    <script src="js/genesis/domain/bus/GenesisBusZ80.js"></script>
    <script src="js/genesis/domain/bus/GenesisBusM68k.js"></script>
    <script src="js/genesis/domain/controller/GenesisIoPort.js"></script>
    <script src="js/genesis/domain/controller/GenesisControllerManager.js"></script>
    <script src="js/genesis/domain/cpu/m68000.js"></script>
    <script src="js/genesis/domain/cpu/instructions/M68kSystemExceptions.js"></script>
    <script src="js/genesis/domain/cpu/instructions/M68kDataTransfer.js"></script>
    <script src="js/genesis/domain/cpu/instructions/M68kArithmetic.js"></script>
    <script src="js/genesis/domain/cpu/instructions/M68kShiftRotate.js"></script>
    <script src="js/genesis/domain/cpu/instructions/M68kBitwise.js"></script>
    <script src="js/genesis/domain/cpu/instructions/M68kLogical.js"></script>
    <script src="js/genesis/domain/cpu/instructions/M68kProgramFlow.js"></script>
    <script src="js/genesis/domain/cpu/GenesisZ80.js"></script>
    <script src="js/genesis/infrastructure/video/GenesisPostProcessor.js"></script>
    <script src="js/genesis/infrastructure/video/GenesisVdp.js"></script>
    <script src="js/genesis/infrastructure/audio/GenesisLowPassFilter.js"></script>
    <script src="js/genesis/infrastructure/audio/GenesisPsg.js"></script>
    <script src="js/genesis/infrastructure/audio/GenesisYm2612.js"></script>
    <script src="js/genesis/infrastructure/audio/GenesisCdc.js"></script>
    <script src="js/genesis/infrastructure/audio/GenesisCdda.js"></script>
    <script src="js/genesis/infrastructure/audio/GenesisPcm.js"></script>
    <script src="js/genesis/application/GenesisOrchestrator.js"></script>
    <script src="js/genesis/presentation/GenesisUIController.js"></script>

    <!-- ========================================================= -->
    <!-- SUPER NINTENDO (SNES) CORE - Adapters & Stable Engine     -->
    <!-- ========================================================= -->
    <!-- 1. Infrastructure Layer (Compatibility Shim & Audio/Video Adapters) -->
    <script src="js/snes/infrastructure/SnesCompatibilityLayer.js"></script>
    <script src="js/snes/infrastructure/video/SnesPostProcessor.js"></script>
    <script src="js/snes/infrastructure/audio/SnesAudioProcessor.js"></script>
    
    <!-- 2. Original Unrefactored Hardware Core Files (Loaded directly from js/snes/) -->
    <script src="js/snes/cpu.js"></script>
    <script src="js/snes/pipu.js"></script>
    <script src="js/snes/spc.js"></script>
    <script src="js/snes/dsp.js"></script>
    <script src="js/snes/apu.js"></script>
    <script src="js/snes/cart.js"></script>
    <script src="js/snes/snes.js"></script>
    
    <!-- 3. Unified Application & Presentation Layers -->
    <script src="js/snes/application/SnesOrchestrator.js"></script>
    <script src="js/snes/presentation/SnesUIController.js"></script>

    <!-- ========================================================= -->
    <!-- SYSTEM BOOTSTRAPPER (Composition Root)                    -->
    <!-- ========================================================= -->
    <script src="js/app.js"></script>
</body>
</html>
