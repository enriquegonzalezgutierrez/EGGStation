<!DOCTYPE html>
<html lang="en">
<head>
    <!--
      * Project: EGGStation - Unified Multi-System Console Virtual Environment
      * Author: Enrique González Gutiérrez
      * File: index.html
      * 
      * Role:
      * Master View / DOM Layout (Presentation Layer). Defines the structured UI 
      * layout elements (Unified Interactive Canvas, Control Sliders, Drawer Overlays) 
      * required by the presentation layer UIControllers.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EGGStation | Unified Multi-System Console Virtual Environment</title>
    
    <!-- Synthwave / Glassmorphism UI Stylesheet -->
    <link rel="stylesheet" href="css/main.css">
    
    <!-- External Compression Libraries (For decompression of zipped ROM packages) -->
    <script src="js/snes/lib/zip.js"></script>
    <script src="js/snes/lib/inflate.js"></script>
    <script src="js/snes/lib/deflate.js"></script>
</head>
<body>

    <!-- Translucent overlay to dim the emulator stage when mobile drawer is expanded -->
    <div id="mobile-drawer-overlay" class="hidden"></div>

    <!-- Main Grid App Container -->
    <div id="app-container">

        <!-- HEADER: Branding & System Swapper -->
        <header id="top-bar">
            <div class="brand">
                <img src="img/eggstation-visualizer.png" alt="EGGStation Logo" class="brand-logo">
                <h1>EGG<span>Station</span></h1>
            </div>
            
            <div class="system-stats">
                <!-- Desktop Games Library Toggle Button -->
                <button id="library-toggle-btn" class="btn outline-btn hide-on-mobile">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                    GAMES LIBRARY
                </button>

                <select id="consoleSelector" class="sys-selector">
                    <option value="SMS">Sega Master System</option>
                    <option value="GEN">Sega Genesis / Mega Drive</option>
                    <option value="SNES">Super Nintendo (SNES)</option>
                </select>
                <span id="fpsSpan">0.0 FPS</span>
                <button id="dev-toggle-btn" class="btn outline-btn hide-on-mobile">DEV MODE</button>
                
                <!-- Mobile Action Button Group (Portrait Mode) -->
                <div class="mobile-action-group show-on-mobile">
                    <button id="mobile-library-btn" class="btn outline-btn" aria-label="Library" style="margin-right: 8px;">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                    </button>
                    <button id="mobile-menu-btn" class="btn outline-btn" aria-label="Settings">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- STAGE: Aspect-Ratio Television Viewport & ROM Overlay -->
        <main id="stage">
            <div id="crt-wrapper">
                <canvas id="smsdisplay"></canvas>
                <canvas id="webgldisplay" class="hidden"></canvas>
                
                <!-- Overlay ROM Uploader -->
                <div id="fileselector" class="overlay-center">
                    <button id="romLoaderBtn" class="btn primary-btn pulse-anim">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        INSERT CARTRIDGE
                    </button>
                    <input type="file" id="cartridgeSelector" accept=".sms,.sg,.md,.gen,.bin,.smd,.sfc,.smc,.zip" style="display: none;">
                </div>
            </div>

            <!-- Virtual On-Screen Gamepad for Mobile -->
            <section id="virtual-gamepad">
                <button id="landscape-menu-btn" class="floating-menu-btn hidden">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>

                <div class="d-pad">
                    <button class="v-dir" id="v-up"></button>
                    <button class="v-dir" id="v-left"></button>
                    <div class="v-center"></div>
                    <button class="v-dir" id="v-right"></button>
                    <button class="v-dir" id="v-down"></button>
                </div>
                
                <div class="center-controls">
                    <button class="v-system-btn" id="v-select">SELECT</button>
                    <button class="v-system-btn" id="v-pause">START</button>
                </div>
                
                <div class="action-buttons">
                    <button class="v-action btn-top" id="v-btnX">X</button>
                    <button class="v-action btn-left" id="v-btnY">Y</button>
                    <div class="v-action-center"></div>
                    <button class="v-action btn-right" id="v-btn1">A</button>
                    <button class="v-action btn-bottom" id="v-btn2">B</button>
                </div>
            </section>
        </main>

        <!-- GAMES LIBRARY DRAWER -->
        <aside id="library-panel" class="glass-panel library-closed">
            <div class="drawer-header">
                <h2>Games Library</h2>
                <button id="close-library-btn" class="btn outline-btn">✖</button>
            </div>
            <div id="library-grid" class="library-scroll-area"></div>
        </aside>

        <!-- SIDEBAR: Settings & Hardware Toggles -->
        <aside id="settings-panel" class="glass-panel drawer-closed">
            <div class="drawer-header show-on-mobile">
                <h2>Settings</h2>
                <button id="close-menu-btn" class="btn outline-btn">✖</button>
            </div>

            <div class="panel-section">
                <h3>System Configuration</h3>
                <div class="control-group">
                    <label>Audio Output</label>
                    <select id="audioToggleSelector">
                        <option value="enabled">Audio Enabled</option>
                        <option value="disabled">Mute / Disable Audio</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Audio DSP Filter</label>
                    <select id="audioFilterSelector">
                        <option value="0">Studio Clean (Bypass)</option>
                        <option value="1">Low-Pass RF Filter (3.5KHz)</option>
                        <option value="2">Analog Stereo Width</option>
                    </select>
                </div>
                <button id="ejectBtn" class="btn eject-btn-retro mt-3">
                    <svg class="icon-eject" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 17h14v2H5zM12 5l-7 8h14z"/>
                    </svg>
                    EJECT CARTRIDGE
                </button>
            </div>

            <div class="panel-section">
                <h3>Video Output</h3>
                <div class="control-group">
                    <label>Post-Processing Engine</label>
                    <select id="postProcessSelector">
                        <option value="0">1x Sharp (Nearest Neighbor)</option>
                        <option value="1">1x Bilinear (Smooth)</option>
                        <option value="2">Scale2X (Hardware Upscaler)</option>
                        <option value="3">Scale2X + Fixed Scanlines</option>
                        <option value="4">Scale4X (Cartoon Smoothing)</option>
                        <option value="5">NTSC Analog Bleed</option>
                        <option value="6">WebGL2: CRT-Royale Shader</option>
                    </select>
                </div>
                <div class="control-group shader-tuner">
                    <label>CRT Curvature</label>
                    <input type="range" id="sh-curvature" min="0" max="200" value="90">
                    <label>Scanline Weight</label>
                    <input type="range" id="sh-scanlines" min="0" max="100" value="38">
                </div>
            </div>

            <div class="panel-section">
                <h3>Temporal Physics</h3>
                <div class="savestate-preview">
                    <img id="savestateImg" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Savestate Empty">
                </div>
                <div class="savestate-actions">
                    <button id="btn-save" class="btn outline-btn">SAVE (F2)</button>
                    <button id="btn-load" class="btn outline-btn">LOAD (F3)</button>
                </div>
            </div>
        </aside>

        <!-- DEVELOPER SUITE -->
        <footer id="developer-suite" class="glass-panel hidden">
            <div class="dev-section">
                <h4>Execution Core</h4>
                <div class="dev-btn-group">
                    <button id="dbg-play" class="btn dev-btn">▶ PLAY</button>
                    <button id="dbg-pause" class="btn dev-btn">⏸ PAUSE</button>
                </div>
            </div>
            <div class="dev-section">
                <h4>Hardware Registers</h4>
                <div class="registers-grid" id="reg-grid"></div>
            </div>
            <div class="dev-section">
                <h4>Diagnostic VRAM Viewer</h4>
                <div class="vram-preview-wrapper">
                    <canvas id="vram-canvas" width="128" height="192"></canvas>
                </div>
            </div>
            <div class="dev-section">
                <h4>System Logs</h4>
                <div id="log" class="terminal-box"></div>
            </div>
        </footer>

    </div>

    <!-- SYSTEM INFRASTRUCTURE & PRESENTATION -->
    <script src="js/shared/video/UniversalPostProcessor.js"></script>
    <script src="js/shared/storage/IndexedDbManager.js"></script>
    <script src="js/shared/storage/RomDecompressor.js"></script>
    <script src="js/shared/presentation/UniversalInputManager.js"></script>
    <script src="js/shared/presentation/UniversalDragDropHandler.js"></script>
    <script src="js/shared/presentation/UniversalFeedbackManager.js"></script>
    <script src="js/shared/presentation/UniversalDevSuiteManager.js"></script>
    
    <!-- COMPILED WEBASSEMBLY BINARY MODULES -->
    <script src="build/SegaPsg.js"></script>
    <script src="build/Sega315_5297.js"></script>
    <script src="build/Sega315_5124.js"></script>
    <script src="build/SegaMasterSystemCartridge.js"></script>

    <!-- SHARED HARDWARE CORE ADAPTERS -->
    <script src="js/shared/audio/SegaPsg.js"></script>
    <script src="js/shared/audio/UniversalAudioProcessor.js"></script>

    <!-- Z80 CPU FAMILY -->
    <script src="js/shared/cpu/z80/Z80Registers.js"></script>
    <script src="js/shared/cpu/z80/Z80Alu.js"></script>
    <script src="js/shared/cpu/z80/ZilogZ80.js"></script>
    <script src="js/shared/cpu/z80/Z80Disassembler.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80DataTransfer.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80Arithmetic.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80Bitwise.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80ShiftRotate.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80ProgramFlow.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80BlockOps.js"></script>
    <script src="js/shared/cpu/z80/instructions/Z80SystemIO.js"></script>

    <!-- M68K CPU FAMILY -->
    <script src="js/shared/cpu/m68k/m68k.js"></script>
    <script src="js/shared/cpu/m68k/instructions/M68kSystemExceptions.js"></script>
    <script src="js/shared/cpu/m68k/instructions/M68kDataTransfer.js"></script>
    <script src="js/shared/cpu/m68k/instructions/M68kArithmetic.js"></script>
    <script src="js/shared/cpu/m68k/instructions/M68kShiftRotate.js"></script>
    <script src="js/shared/cpu/m68k/instructions/M68kBitwise.js"></script>
    <script src="js/shared/cpu/m68k/instructions/M68kLogical.js"></script>
    <script src="js/shared/cpu/m68k/instructions/M68kProgramFlow.js"></script>

    <!-- SEGA MASTER SYSTEM (SMS) DOMAIN - WASM ENABLED -->
    <script src="js/sms/domain/bus/SegaMasterSystemBus.js"></script>
    <script src="js/sms/domain/cartridge/SegaMasterSystemCartridge.js"></script>
    <script src="js/sms/domain/cartridge/mappers/BaseMapper.js"></script>
    <script src="js/sms/domain/controller/Sega315_5297.js"></script>
    <script src="js/sms/infrastructure/video/Sega315_5124_Vdp.js"></script>
    <script src="js/sms/application/SmsOrchestrator.js"></script>
    <script src="js/sms/presentation/SmsUIController.js"></script>

    <!-- SEGA GENESIS / MEGA DRIVE DOMAIN -->
    <script src="js/genesis/domain/bus/GenesisBusZ80.js"></script>
    <script src="js/genesis/domain/bus/GenesisBusM68k.js"></script>
    <script src="js/genesis/domain/controller/GenesisIoPort.js"></script>
    <script src="js/genesis/domain/controller/GenesisControllerManager.js"></script>
    <script src="js/genesis/domain/cpu/GenesisZ80.js"></script>
    <script src="js/genesis/infrastructure/video/GenesisVdp.js"></script>
    <script src="js/genesis/infrastructure/audio/GenesisLowPassFilter.js"></script>
    <script src="js/genesis/infrastructure/audio/GenesisYm2612.js"></script>
    <script src="js/genesis/infrastructure/audio/GenesisCdc.js"></script>
    <script src="js/genesis/infrastructure/audio/GenesisCdda.js"></script>
    <script src="js/genesis/infrastructure/audio/GenesisPcm.js"></script>
    <script src="js/genesis/application/GenesisOrchestrator.js"></script>
    <script src="js/genesis/presentation/GenesisUIController.js"></script>

    <!-- SUPER NINTENDO (SNES) DOMAIN -->
    <script src="js/snes/infrastructure/SnesCompatibilityLayer.js"></script>
    <script src="js/snes/domain/cpu/SnesCpu.js"></script>
    <script src="js/snes/domain/cpu/SnesCpuAddressing.js"></script>
    <script src="js/snes/domain/cpu/SnesCpuDataOps.js"></script>
    <script src="js/snes/domain/cpu/SnesCpuArithmetic.js"></script>
    <script src="js/snes/domain/cpu/SnesCpuLogic.js"></script>
    <script src="js/snes/domain/spc/SnesSpc.js"></script>
    <script src="js/snes/domain/spc/SnesSpcAddressing.js"></script>
    <script src="js/snes/domain/spc/SnesSpcArithmetic.js"></script>
    <script src="js/snes/domain/spc/SnesSpcLogic.js"></script>
    <script src="js/snes/domain/spc/SnesSpcDataOps.js"></script>
    <script src="js/snes/domain/apu/SnesApuTimer.js"></script>
    <script src="js/snes/domain/apu/SnesApu.js"></script>
    <script src="js/snes/domain/dsp/SnesDsp.js"></script>
    <script src="js/snes/domain/dsp/SnesDspTables.js"></script>
    <script src="js/snes/domain/dsp/SnesDspDecoder.js"></script>
    <script src="js/snes/domain/dsp/SnesDspChannel.js"></script>
    <script src="js/snes/domain/cartridge/SnesCartridge.js"></script>
    <script src="js/snes/domain/ppu/SnesPpu.js"></script>
    <script src="js/snes/domain/ppu/SnesPpuTables.js"></script>
    <script src="js/snes/domain/ppu/SnesPpuBackground.js"></script>
    <script src="js/snes/domain/ppu/SnesPpuSprite.js"></script>
    <script src="js/snes/domain/ppu/SnesPpuMode7.js"></script>
    <script src="js/snes/domain/ppu/SnesPpuCompositor.js"></script>
    <script src="js/snes/domain/bus/SnesMemoryMap.js"></script>
    <script src="js/snes/domain/system/SnesSystem.js"></script>
    <script src="js/snes/domain/system/SnesSystemDma.js"></script>
    <script src="js/snes/domain/system/SnesSystemIoPorts.js"></script>
    <script src="js/snes/domain/system/SnesSystemBus.js"></script>
    
    <script src="js/snes/application/SnesOrchestrator.js"></script>
    <script src="js/snes/presentation/SnesUIController.js"></script>

    <!-- Master Application Bootstrapper -->
    <script src="js/app.js"></script>
</body>
</html>
